name: Android arm64-v8a APK

run-name: Build Android arm64-v8a APK from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'GitHub Actions artifact name for the APK bundle'
        required: false
        type: string
        default: 'blinko-android-arm64-v8a-apk'

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.0.11902837

jobs:
  build-debug-apk:
    name: Build Android arm64-v8a APK artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.8

      - name: Install Dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun install --frozen-lockfile

      - name: Run Prisma Generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run prisma:generate

      - name: Configure Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0-alpha"

      - name: Build Android arm64-v8a APK without production signing secrets
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug-upload-keystore.jks" \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Blinko,C=US"
          mkdir -p app/src-tauri/gen/android
          cat > app/src-tauri/gen/android/keystore.properties <<EOF
          password=android
          keyAlias=upload
          storeFile=$HOME/.android/debug-upload-keystore.jks
          EOF
          cd app
          bun run tauri:android:build -- --target aarch64 --apk --ci

      - name: Collect APK outputs
        run: |
          set -euo pipefail
          mkdir -p android-apk-artifacts
          APK_ROOT="app/src-tauri/gen/android/app/build/outputs/apk"
          mapfile -t APK_CANDIDATES < <(find "$APK_ROOT" -type f -name '*.apk' | sort)
          if [ "${#APK_CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one arm64-v8a APK, found ${#APK_CANDIDATES[@]}."
            find "$APK_ROOT" -type f -name '*.apk' -print || true
            exit 1
          fi
          SOURCE_APK="${APK_CANDIDATES[0]}"
          python3 - "$SOURCE_APK" <<'PY'
          import sys
          import zipfile

          apk_path = sys.argv[1]
          disallowed_prefixes = (
              "lib/armeabi-v7a/",
              "lib/x86/",
              "lib/x86_64/",
          )
          with zipfile.ZipFile(apk_path) as apk:
              names = apk.namelist()
          has_arm64 = any(name.startswith("lib/arm64-v8a/") for name in names)
          disallowed = [name for name in names if name.startswith(disallowed_prefixes)]
          if not has_arm64:
              raise SystemExit("APK does not contain arm64-v8a native libraries")
          if disallowed:
              raise SystemExit("APK contains non-arm64 native libraries: " + ", ".join(disallowed[:10]))
          print("APK ABI validation passed: arm64-v8a only")
          PY
          cp "$SOURCE_APK" android-apk-artifacts/Blinko_arm64-v8a_release-test-signed.apk
          ls -lh android-apk-artifacts

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name || 'blinko-android-arm64-v8a-apk' }}
          path: android-apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Download summary
        run: |
          echo "### Android arm64-v8a APK artifact ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${{ github.event.inputs.artifact_name || 'blinko-android-arm64-v8a-apk' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ABI: arm64-v8a only, for modern Android phones." >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: release-mode APK signed with a workflow-generated test key, not the production upload key." >> "$GITHUB_STEP_SUMMARY"
