name: Android Debug APK

run-name: Build Android debug APK from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'GitHub Actions artifact name for the APK bundle'
        required: false
        type: string
        default: 'blinko-android-debug-apk'

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.0.11902837

jobs:
  build-debug-apk:
    name: Build unsigned Android APK artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.8

      - name: Install Dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun install --frozen-lockfile

      - name: Run Prisma Generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run prisma:generate

      - name: Configure Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0-alpha"

      - name: Build Android APK without release secrets
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug-upload-keystore.jks" \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Blinko,C=US"
          mkdir -p app/src-tauri/gen/android
          cat > app/src-tauri/gen/android/keystore.properties <<EOF
          password=android
          keyAlias=upload
          storeFile=$HOME/.android/debug-upload-keystore.jks
          EOF
          cd app
          bun run tauri:android:build -- --debug --apk --ci

      - name: Collect APK outputs
        run: |
          set -euo pipefail
          mkdir -p android-apk-artifacts
          find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} android-apk-artifacts/ \;
          if ! ls android-apk-artifacts/*.apk >/dev/null 2>&1; then
            echo "::error::No APK files were produced by the Android build."
            exit 1
          fi
          ls -lh android-apk-artifacts

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name || 'blinko-android-debug-apk' }}
          path: android-apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Download summary
        run: |
          echo "### Android debug APK artifact ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${{ github.event.inputs.artifact_name || 'blinko-android-debug-apk' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This APK is for manual testing from GitHub Actions artifacts, not a signed Release asset." >> "$GITHUB_STEP_SUMMARY"
